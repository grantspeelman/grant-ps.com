<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../site/assets/style.css">
<!-- Source of site/assets/og-default.png (1200x630). Re-render with: bin/check-pages --og -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background-color: #fbfbf7; background-size: 40px 40px; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 88px; display: flex; flex-direction: column; justify-content: space-between; border-top: 16px solid #056b4a; }
  .top { font-family: var(--mono); font-size: 34px; color: #1d2320; font-weight: 600; }
  .top .p { color: #056b4a; }
  .cur { display: inline-block; width: .55em; height: 1.05em; background: #056b4a; vertical-align: -0.15em; margin-left: .15em; }
  h1 { font-family: var(--sans); font-weight: 600; font-size: 104px; line-height: 1.02; letter-spacing: -0.03em; color: #1d2320; margin: 0; }
  .cmd { font-family: var(--mono); font-size: 30px; color: #56605a; margin: 0 0 18px; }
  .cmd b { color: #056b4a; font-weight: 400; }
  .foot { font-family: var(--mono); font-size: 28px; color: #56605a; display: flex; justify-content: space-between; border-top: 2px dashed #d5dbd6; padding-top: 26px; }
</style></head><body>
<div class="card">
  <div class="top"><span class="p">~/</span>grant-ps.com<span class="cur"></span></div>
  <div><p class="cmd"><b>$</b> whoami</p><h1>Grant<br>Petersen-Speelman</h1></div>
  <div class="foot"><span>writing</span><span>grant-ps.com</span></div>
</div></body></html>
