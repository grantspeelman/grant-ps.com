# Base definition shared by VS Code and start.sh. It deliberately mounts nothing
# from the host but this checkout: no ~/.ssh, no ~/.claude, no home directory.
# .git/hooks, .git/config and .githooks/ are mounted read-only on top, so a prompt-injected
# command in here can't plant code that host git later runs. .devcontainer/ is
# left writable so agents can maintain it; review changes before running them.
# start.sh layers compose.ssh.yml (agent forwarding) and, with --docker,
# compose.docker.yml (privileged nested Docker) on top of it.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
      # No `network: host` here: Compose builds through buildx bake, which
      # refuses it without a `--allow=network.host` that neither start.sh nor
      # VS Code can pass.
    # Host networking for the container: on this machine a VPN's netfilter rules
    # can break Docker's bridge NAT and with it all container DNS. The cost is
    # that the container shares the host's network stack, so it can reach
    # services listening on the host's localhost.
    network_mode: host
    volumes:
      - ..:/workspace:cached
      # Host git runs hooks from here, and commands named in .git/config
      # (core.fsmonitor, core.sshCommand, aliases, filters...). The container's
      # own hooks are .githooks/, set as core.hooksPath in .git/config and in
      # the Dockerfile; host git runs those too, so they're read-only as well.
      - ../.git/hooks:/workspace/.git/hooks:ro
      - ../.git/config:/workspace/.git/config:ro
      - ../.githooks:/workspace/.githooks:ro
      - claude-config:/home/vscode/.claude
      - bundle:/home/vscode/.bundle
    # GH_TOKEN=... for gh, from a host file outside the checkout, where the
    # container can't read or change it. A fine-grained token scoped to this
    # repo is enough. No `environment:` pass-through on purpose: an unset
    # pass-through overrides the file with nothing.
    env_file:
      - path: ${HOME}/.config/grantspeelman/grant-ps.com/gh.env
        required: false

volumes:
  # A fixed name, so the Claude login is shared by every container for this
  # repo: VS Code's and start.sh's, across checkouts and rebuilds.
  claude-config:
    name: grant-ps-com-claude-config
  # Gems from `bundle install` (BUNDLE_PATH), kept across rebuilds.
  bundle:
